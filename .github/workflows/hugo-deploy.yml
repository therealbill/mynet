# Hugo GitHub Pages Deployment
# Generated by hugo-repo plugin
#
# Prerequisites:
# 1. Go to Settings > Pages > Source > set to "GitHub Actions"
# 2. Push to master to trigger the first deploy

name: Deploy Hugo site to GitHub Pages

on:
  push:
    branches: [master]
    paths:
      # Hugo configuration and standard directories
      - 'content/**'
      - 'layouts/**'
      - 'static/**'
      - 'assets/**'
      - 'data/**'
      - 'hugo.toml'
      - 'go.mod'
      - 'go.sum'
      # Root docs (mounted to content root)
      - 'docs/**'
      # Plugin docs (mounted to content/plugins/<name>/)
      - 'ai-development/docs/**'
      - 'backend-development/docs/**'
      - 'cli-development/docs/**'
      - 'code-quality/docs/**'
      - 'desktop-development/docs/**'
      - 'developer-tools/docs/**'
      - 'devops-and-infra/docs/**'
      - 'diataxis-docs/docs/**'
      - 'game-development/docs/**'
      - 'gnu-make/docs/**'
      - 'hugo-repo/docs/**'
      - 'mcp-development/docs/**'
      - 'mobile-development/docs/**'
      - 'programming-languages/docs/**'
      - 'research/docs/**'
      - 'timelord/docs/content/**'
      - 'utility-agents/docs/**'
      - 'utility-skills/docs/**'
      - 'web-development/docs/**'
      # This workflow
      - '.github/workflows/hugo-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: '0.154.5'
      HUGO_ENVIRONMENT: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Hugo CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb
          sudo dpkg -i ${{ runner.temp }}/hugo.deb

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Cache Hugo modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/hugo_cache
            /tmp/hugo_cache
          key: ${{ runner.os }}-hugo-${{ hashFiles('go.sum') }}
          restore-keys: |
            ${{ runner.os }}-hugo-

      - name: Build with Hugo
        run: |
          hugo \
            --minify \
            --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
