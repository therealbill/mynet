# Hugo Site Configuration
# Mynet Plugin Marketplace Documentation
# Generated by hugo-repo plugin

baseURL = 'https://therealbill.github.io/mynet/'
languageCode = 'en-us'
title = 'Mynet Plugin Marketplace'

# Downgrade broken ref shortcodes to warnings (plugin docs use relative refs
# that don't resolve after being mounted under /plugins/<name>/)
refLinksErrorLevel = 'WARNING'

# Suppress raw HTML warnings from goldmark
ignoreLogs = ['warning-goldmark-raw-html']

# Ignore plan files (no Hugo front matter)
ignoreFiles = ['docs/plans/']

# Theme import via Hugo modules
[module]
  [[module.imports]]
    path = 'github.com/alex-shpak/hugo-book'

  # Standard mounts (required when defining any custom mounts)
  [[module.mounts]]
  source = 'content'
  target = 'content'

  [[module.mounts]]
  source = 'static'
  target = 'static'

  [[module.mounts]]
  source = 'layouts'
  target = 'layouts'

  [[module.mounts]]
  source = 'data'
  target = 'data'

  [[module.mounts]]
  source = 'assets'
  target = 'assets'

  [[module.mounts]]
  source = 'archetypes'
  target = 'archetypes'

  # Root docs mount — marketplace docs become the site home
  [[module.mounts]]
  source = 'docs'
  target = 'content'
  excludeFiles = ['plans/**']

  # Plugin documentation mounts
  [[module.mounts]]
  source = 'ai-development/docs'
  target = 'content/plugins/ai-development'

  [[module.mounts]]
  source = 'backend-development/docs'
  target = 'content/plugins/backend-development'

  [[module.mounts]]
  source = 'cli-development/docs'
  target = 'content/plugins/cli-development'

  [[module.mounts]]
  source = 'code-quality/docs'
  target = 'content/plugins/code-quality'

  [[module.mounts]]
  source = 'desktop-development/docs'
  target = 'content/plugins/desktop-development'

  [[module.mounts]]
  source = 'developer-tools/docs'
  target = 'content/plugins/developer-tools'

  [[module.mounts]]
  source = 'devops-and-infra/docs'
  target = 'content/plugins/devops-and-infra'

  [[module.mounts]]
  source = 'diataxis-docs/docs'
  target = 'content/plugins/diataxis-docs'

  [[module.mounts]]
  source = 'game-development/docs'
  target = 'content/plugins/game-development'

  [[module.mounts]]
  source = 'gnu-make/docs'
  target = 'content/plugins/gnu-make'

  [[module.mounts]]
  source = 'hugo-repo/docs'
  target = 'content/plugins/hugo-repo'

  [[module.mounts]]
  source = 'mcp-development/docs'
  target = 'content/plugins/mcp-development'

  [[module.mounts]]
  source = 'mobile-development/docs'
  target = 'content/plugins/mobile-development'

  [[module.mounts]]
  source = 'programming-languages/docs'
  target = 'content/plugins/programming-languages'

  [[module.mounts]]
  source = 'research/docs'
  target = 'content/plugins/research'

  # timelord special case — content lives one level deeper (legacy Hugo setup)
  [[module.mounts]]
  source = 'timelord/docs/content'
  target = 'content/plugins/timelord'

  [[module.mounts]]
  source = 'utility-agents/docs'
  target = 'content/plugins/utility-agents'

  [[module.mounts]]
  source = 'utility-skills/docs'
  target = 'content/plugins/utility-skills'

  [[module.mounts]]
  source = 'web-development/docs'
  target = 'content/plugins/web-development'

# Site parameters
[params]
  description = 'Documentation for the Mynet Claude Code plugin marketplace'
  BookToC = true
  BookSection = '/'
  BookSearch = true

# Markup configuration
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = false
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 4

# Output formats
[outputs]
  home = ['HTML', 'RSS']
  section = ['HTML', 'RSS']
  page = ['HTML']

# Pagination
[pagination]
  pagerSize = 20
